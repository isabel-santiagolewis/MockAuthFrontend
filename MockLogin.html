<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareConnect Login</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      width: 400px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      background-color: #fff;
    }
    .icon {
      width: 70px;
      height: 70px;
      margin-bottom: 1rem;
      background-color: #7b68ee22;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b68ee;
      font-size: 2rem;
    }
    h2 {
      margin: 0;
      color: #7b68ee;
    }
    p {
      margin-top: 0.5rem;
      color: #666;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem;
      background-color: #7b68ee;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #6a5acd;
    }
    .error {
      color: #d33;
      margin-top: 1rem;
    }
    .loading {
      color: #7b68ee;
      margin-top: 1rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon">🩺</div>
    <h2>CareConnect</h2>
    <p>Closer Connections. Better Care.</p>
    
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button id="loginBtn">Log In</button>
    
    <div id="loading" class="loading"></div>
    <div id="error" class="error"></div>
  </div>
  
  <script>
    const backendBase = "https://6fa48e946f24.ngrok-free.app"; // ✅ your ngrok base URL
    const loginEndpoint = `${backendBase}/v1/api/auth/login`;
    const codeEndpoint = `${backendBase}/v1/api/auth/sso/alexa/code`;

    // ✅ Grab redirect info from Alexa query params
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUri = urlParams.get("redirect_uri") || "https://pitangui.amazon.com/api/skill/link/M1VZ06KRKERWBD";
    const state = urlParams.get("state") || "mock-state";

    const loginBtn = document.getElementById("loginBtn");
    const errorDiv = document.getElementById("error");
    const loadingDiv = document.getElementById("loading");

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      errorDiv.textContent = "";
      loadingDiv.textContent = "";

      if (!email || !password) {
        errorDiv.textContent = "Please enter your email and password.";
        return;
      }

      try {
        loadingDiv.textContent = "Logging in...";
        loginBtn.disabled = true;

        // Step 1️⃣ — Regular login
        const response = await fetch(loginEndpoint, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({ email, password, role: "PATIENT" })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Login failed");

        const jwt = data.token;
        if (!jwt) throw new Error("No token returned from backend.");

        // Step 2️⃣ — Request Alexa temp code
        loadingDiv.textContent = "Generating authorization code...";
        const codeResponse = await fetch(codeEndpoint, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${jwt}`,
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          }
        });

        const codeData = await codeResponse.json();
        if (!codeResponse.ok) throw new Error(codeData.error || "Failed to get authorization code.");

        const code = codeData.code;
        if (!code) throw new Error("No code returned from backend.");

        console.log("✅ Alexa Code:", code);

        // Step 3️⃣ — Redirect back to Alexa with code & state
        let redirect = `${redirectUri}?code=${encodeURIComponent(code)}`;
        if (state) redirect += `&state=${encodeURIComponent(state)}`;
        console.log("🚀 Redirecting to:", redirect);

        loadingDiv.textContent = "Linking your Alexa account...";
        window.location.href = redirect;

      } catch (err) {
        console.error("❌ Error:", err);
        errorDiv.textContent = err.message || "An unexpected error occurred.";
      } finally {
        loadingDiv.textContent = "";
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
